# Barra o problema na máquina de quem escreve (mesmo princípio do ADR-003).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic, pydantic-settings, sqlalchemy]
        args: [--strict]

  - repo: local
    hooks:
      # Só no push: o nome da branch não muda a cada commit, e travar o
      # commit por causa dele atrapalharia mais do que ajuda.
      - id: nome-da-branch
        name: nome da branch no padrao do CONTRIBUTING
        entry: scripts/verificar-nome-da-branch.sh
        language: script
        stages: [pre-push]
        pass_filenames: false
        always_run: true
