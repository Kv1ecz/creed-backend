# Espelha este repositório no GitLab da AGES (tools.ages.pucrs.br).
#
# O GitHub é a fonte da verdade: o que existe aqui sobrescreve o que existe lá,
# e branches/tags apagadas aqui somem lá. Não faça commits direto no GitLab —
# eles serão descartados no próximo espelhamento.
name: Espelhar no GitLab

on:
  push:
    branches: ['**']
    tags: ['**']
  delete:
  workflow_dispatch:

# Dois espelhamentos simultâneos brigariam pelo mesmo remoto.
concurrency:
  group: espelho-gitlab

jobs:
  espelhar:
    runs-on: ubuntu-latest
    # As credenciais moram na Environment GITLAB_MIRROR. Sem esta linha o job
    # não enxerga GITLAB_TOKEN/GITLAB_REPO/GITLAB_USER.
    environment: GITLAB_MIRROR

    steps:
      - uses: actions/checkout@v4
        with:
          # Obrigatório: um clone raso (o padrão) não pode ser empurrado.
          fetch-depth: 0

      - name: Enviar branches e tags
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_USER: ${{ vars.GITLAB_USER || 'oauth2' }}
          GITLAB_REPO: ${{ vars.GITLAB_REPO }}
        run: |
          # A guarda vive aqui, e não em `jobs.<id>.if`: variável de Environment
          # só existe depois que o job começa a rodar, então `vars.GITLAB_REPO`
          # na condição do job seria sempre vazia e o espelhamento ficaria
          # eternamente "skipped".
          if [ -z "$GITLAB_REPO" ]; then
            echo "GITLAB_REPO não configurada na Environment GITLAB_MIRROR — nada a espelhar."
            exit 0
          fi

          # Aceita tanto "host/grupo/repo.git" quanto a URL inteira colada do
          # GitLab; o esquema é remontado abaixo junto com as credenciais.
          DESTINO="${GITLAB_REPO#https://}"
          DESTINO="${DESTINO#http://}"
          USUARIO="${GITLAB_USER#@}"

          # O '+' nos refspecs é force por ref, e é intencional: o GitHub é a
          # fonte da verdade e o GitLab é espelho descartável, então o que
          # divergir lá é sobrescrito daqui.
          #
          # Requisito do outro lado: a branch no GitLab não pode estar
          # protegida contra force push. Se estiver, o pre-receive recusa o
          # push INTEIRO — inclusive a criação de branches novas, que nada têm
          # a ver com a regra — e o job falha com "not allowed to force push".
          git push --prune \
            "https://${USUARIO}:${GITLAB_TOKEN}@${DESTINO}" \
            "+refs/remotes/origin/*:refs/heads/*" \
            "+refs/tags/*:refs/tags/*"
